<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Calculator</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 16px; }
  .card { max-width: 380px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-size: 14px; margin: 14px 0 4px; }
  input { width: 100%; box-sizing: border-box; font-size: 18px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
  .result { margin-top: 24px; padding: 16px; background: #e8f5e9; border-radius: 8px; text-align: center; }
  .result span { display: block; font-size: 14px; color: #333; }
  .result strong { font-size: 32px; }
</style>
</head>
<body>
<div class="card">
  <h1>Price Calculator</h1>
  <label for="materials">Material cost ($)</label>
  <input id="materials" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00">
  <label for="hours">Labor hours (per man)</label>
  <input id="hours" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
  <div class="result">
    <span>Sale price to charge</span>
    <strong id="price">$0.00</strong>
  </div>
</div>
<script>
  // Fixed assumptions (see README)
  const MEN = 2;
  const RATE = 30;      // dollars per hour, per man
  const MARGIN = 0.55;  // gross margin on the sale price

  const materials = document.getElementById('materials');
  const hours = document.getElementById('hours');
  const price = document.getElementById('price');

  function update() {
    const m = Math.max(parseFloat(materials.value) || 0, 0);
    const h = Math.max(parseFloat(hours.value) || 0, 0);
    const cost = m + h * MEN * RATE;
    const sale = Math.ceil(cost / (1 - MARGIN) / 5 - 1e-9) * 5; // round up to next $5 (tiny offset avoids float error)
    price.textContent = sale.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
  }

  materials.addEventListener('input', update);
  hours.addEventListener('input', update);
  update();
</script>
</body>
</html>
